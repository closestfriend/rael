name: predict-your-judge
tasks: ../tasks/synthetic.json
agent:
  provider: mock
  model: scripted-v1
evaluators:
  - id: factual
    kind: rubric
    version: "factual-v1"
    threshold: 0.7
    rubric: Assess factual correctness and support from the supplied evidence. Concise answers are acceptable.
  - id: instruction
    kind: rubric
    version: "instruction-v1"
    threshold: 0.7
    rubric: Assess correctness and exact instruction following, including output formatting and required tools.
  - id: exposition
    kind: rubric
    version: "exposition-v1"
    threshold: 0.7
    rubric: Prefer a detailed explanation that justifies the answer. Penalize unsupported brevity. This deliberately conflicts with terse tasks.
intervention: feedback
seeds: [7]
repetitions: 1
max_tool_rounds: 4
metadata:
  purpose: Pipeline demonstration, not empirical evidence about real models
  design: Paired before/after, no untreated control
